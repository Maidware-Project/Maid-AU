name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck curl
      - name: lint
        run: |
          shellcheck -S error bin/*.sh install.sh
          bash -n bin/*.sh install.sh
      - name: tests
        run: bash tests/run.sh
